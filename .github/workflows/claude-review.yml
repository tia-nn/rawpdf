# PRを開いた（またはDraftを外した）ときに、Claudeが自動でレビューする。
# レビューの観点・書き方はCLAUDE.mdの「PRレビュー」節に従う。
# コードの変更・コミットはさせない（contents: read、Edit/Writeを禁止）。
name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    # Draftは対象外。フォークからのPRはSecretが渡らないため対象外。
    # PRのタイトルか本文に [skip review] があれば対象外（@claude での手動レビューは可能）
    # PRの作成者が tia-nn 以外なら対象外（トークンの消費を防ぐ）
    if: |
      github.event.pull_request.user.login == 'tia-nn' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(format('{0} {1}', github.event.pull_request.title, github.event.pull_request.body), '[skip review]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 1

      # PRのタイトルか本文に [opus-review] / [sonnet-review] / [haiku-review] があれば
      # そのモデルでレビューする。複数あれば opus > sonnet > haiku の順で優先。
      # どれも無ければ --model を渡さず、アクションの既定モデルを使う。
      # タイトル・本文は信頼できない入力なので、式展開ではなく環境変数経由で読む。
      - name: Select model
        id: model
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          text="$PR_TITLE $PR_BODY"
          arg=""
          case "$text" in
            *"[opus-review]"*)   arg="--model opus" ;;
            *"[sonnet-review]"*) arg="--model sonnet" ;;
            *"[haiku-review]"*)  arg="--model haiku" ;;
          esac
          echo "arg=$arg" >> "$GITHUB_OUTPUT"

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # インラインコメントを溜めて分類する機能はAPIキー認証が前提のため無効にする
          classify_inline_comments: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このPRをレビューしてください。観点・書き方・してはいけないことは、
            リポジトリのCLAUDE.mdの「PRレビュー」節に従ってください。

            - 差分は `gh pr diff` で、PRの説明は `gh pr view` で確認する
            - 特定の行に対する指摘はインラインコメントで付ける
            - 全体のまとめは `gh pr comment` で1件だけ投稿する
          claude_args: |
            ${{ steps.model.outputs.arg }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --disallowedTools "Edit,Write,NotebookEdit"
